        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fcf6eb 0%, #e3ceab 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .table-header {
            background: linear-gradient(to right, #c19b77, #a67c52);
            position: sticky;
            top: 0;
            z-index: 40;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .product-row {
            background: linear-gradient(to right, #a07a58, #865f3d);
        }
        
        .image-clickable {
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .image-clickable:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .modal-content {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .nav-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
    </style>

        let activeProduct = null;
        let activeImgIdx = 0;

        function renderProducts(data) {
            const list = document.getElementById('products-container');
            list.innerHTML = '';
            
            data.forEach(p => {
                const row = document.createElement('div');
                row.className = 'product-row flex items-center justify-between text-white p-2 sm:p-3 text-sm sm:text-base font-bold shadow-sm';
                
                row.innerHTML = `
                    <div class="w-[8%] text-center bg-black/30 rounded py-1 text-yellow-400 font-black text-xs">${p.id}</div>
                    
                    <div class="w-[24%] text-center flex flex-col leading-tight border-r border-white/10">
                        <span class="text-yellow-100">${p.count}</span>
                        <span class="text-[10px] sm:text-xs opacity-70 font-normal italic">${p.pkg}</span>
                    </div>
                    
                    <div class="w-[20%] text-center flex flex-col leading-tight border-r border-white/10">
                        <span class="text-white text-[13px] sm:text-xl font-black">${p.price}</span>
                        <span class="text-[10px] sm:text-xs text-yellow-300 opacity-90 font-normal">${p.unit}</span>
                    </div>
                    
                    <div class="w-[33%] text-center pr-1 sm:pr-2 leading-tight border-r border-white/10 text-[11px] sm:text-lg">
                        ${p.name}
                    </div>
                    
                    <div class="w-[15%] flex justify-center border-r border-white/10">
                        <img src="${p.img[0]}" 
                             onerror="this.src='https://placehold.co/100?text=TIGER'" 
                             onclick="startGallery(${p.id})"
                             class="image-clickable w-10 h-10 sm:w-16 sm:h-16 object-cover rounded-lg border-2 border-white/30 bg-white">
                    </div>
                `;
                list.appendChild(row);
            });
        }

        function startGallery(id) {
            activeProduct = products.find(p => p.id === id);
            activeImgIdx = 0;
            refreshModal();
            document.getElementById('image-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function refreshModal() {
            const img = document.getElementById('enlarged-image');
            const title = document.getElementById('enlarged-title');
            const counter = document.getElementById('image-counter');
            const navs = document.getElementById('nav-controls');
            img.src = activeProduct.img[activeImgIdx];
            title.innerText = activeProduct.name;
            if (activeProduct.img.length > 1) {
                navs.classList.remove('hidden');
                counter.innerText = `الصورة ${activeImgIdx + 1} من ${activeProduct.img.length}`;
            } else {
                navs.classList.add('hidden');
                counter.innerText = '';
            }
        }

        function nextImg() {
            activeImgIdx = (activeImgIdx + 1) % activeProduct.img.length;
            refreshModal();
        }

        function prevImg() {
            activeImgIdx = (activeImgIdx - 1 + activeProduct.img.length) % activeProduct.img.length;
            refreshModal();
        }

        function closeModal() {
            document.getElementById('image-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function filterProducts() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => p.name.toLowerCase().includes(val));
            document.getElementById('noResults').classList.toggle('hidden', filtered.length > 0);
            renderProducts(filtered);
        }

        renderProducts(products);
    </script>
